apiVersion: 1

datasources:
  - name: InfluxDB
    uid: billetera-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: false
    editable: false
    jsonData:
      version: Flux
      organization: billetera_org
      defaultBucket: billetera_metricas
      httpMode: POST
    secureJsonData:
      token: billetera-super-secret-token-influxdb-2024

