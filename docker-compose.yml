services:
  # ---------------- Base de datos ----------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Zona horaria para que "hoy" y "este mes" coincidan con tu hora local
    command: ["postgres", "-c", "timezone=${ZONA_HORARIA:-America/La_Paz}"]
    environment:
      POSTGRES_DB: billetera
      POSTGRES_USER: billetera
      POSTGRES_PASSWORD: ${DB_PASSWORD:-billetera_local}
    volumes:
      - datos-db:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # crea tablas y datos la primera vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billetera -d billetera"]
      interval: 3s
      retries: 20

  # ---------------- API + app móvil ----------------
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://billetera:${DB_PASSWORD:-billetera_local}@db:5432/billetera
      GRAFANA_INTERNAL_URL: http://grafana:3000   # la app la publica en /grafana/
    ports:
      - "8000:8000"
    volumes:
      - ./api/static:/app/static:ro   # editas el frontend y solo recargas la página
    depends_on:
      db:
        condition: service_healthy

  # ---------------- Grafana (gráficos) ----------------
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      # Grafana vive en la ruta /grafana/ de la app (http://<tu-ip>:8000/grafana/)
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LIVE_MAX_CONNECTIONS: "0"              # sin tiempo real (no hace falta)
      # Grafana dibuja los gráficos como imágenes PNG (livianas para el celular)
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/grafana/
      GF_RENDERING_CONCURRENT_RENDER_REQUEST_LIMIT: "10"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${ZONA_HORARIA:-America/La_Paz}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "true"       # permite mostrar los gráficos dentro de la app
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # se pueden ver sin iniciar sesión (solo lectura)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/billetera.json
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"   # solo accesible desde esta PC; el resto entra por la app
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - datos-grafana:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy

  # ---------------- Renderizador de imágenes de Grafana ----------------
  renderer:
    image: grafana/grafana-image-renderer:3.11.0
    restart: unless-stopped
    environment:
      RENDERING_MODE: clustered            # reutiliza el navegador interno: más rápido
      RENDERING_CLUSTERING_MODE: context
      RENDERING_CLUSTERING_MAX_CONCURRENCY: "8"
      RENDERING_CLUSTERING_TIMEOUT: "60"

  # ---------------- Conexión segura con Grafana Cloud (opcional) ----------------
  # Crea un túnel de SALIDA hacia tu Grafana Cloud para que pueda leer la base
  # de datos sin abrir puertos ni publicar nada en internet.
  # Se activa con:  docker compose --profile cloud up -d
  pdc:
    image: grafana/pdc-agent:latest
    profiles: ["cloud"]
    restart: unless-stopped
    command:
      - "-token"
      - "${PDC_TOKEN:-}"
      - "-cluster"
      - "${PDC_CLUSTER:-}"
      - "-gcloud-hosted-grafana-id"
      - "${PDC_GRAFANA_ID:-}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos-db:
  datos-grafana:
